<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>팀 일정 현황판</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>팀 일정 현황판</h1>

    <div class="filter">
      <label for="owner-filter">담당자</label>
      <select id="owner-filter">
        <option value="">전체</option>
        <option value="김하늘">김하늘</option>
        <option value="이도윤">이도윤</option>
        <option value="박서연">박서연</option>
        <option value="최민준">최민준</option>
      </select>
    </div>

    <table id="schedule-table">
      <thead>
        <tr>
          <th scope="col">일정</th>
          <th scope="col">담당자</th>
          <th scope="col">기한</th>
          <th scope="col">상태</th>
        </tr>
      </thead>
      <tbody id="schedule-body"></tbody>
    </table>
  </main>

  <script src="app.js"></script>
</body>
</html>
